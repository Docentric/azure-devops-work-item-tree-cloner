name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        rid: [ win-x64, win-arm64, linux-x64, linux-arm64 ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish (${{ matrix.rid }})
        run: >
          dotnet publish src/AdoWorkItemTreeCloner/AdoWorkItemTreeCloner.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained false
          --output publish/${{ matrix.rid }}
          -p:CI=true

      - name: Zip artifact
        run: |
          cd publish/${{ matrix.rid }}
          zip -r ../../Ado.WorkItemTreeCloner-${{ matrix.rid }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: Ado.WorkItemTreeCloner-${{ matrix.rid }}
          path: Ado.WorkItemTreeCloner-${{ matrix.rid }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
