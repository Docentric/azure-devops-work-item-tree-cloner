name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore AdoWorkItemTreeCloner.slnx

      - name: Build
        run: dotnet build AdoWorkItemTreeCloner.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test AdoWorkItemTreeCloner.slnx --no-build --configuration Release
