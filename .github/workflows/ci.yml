name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore AdoWorkItemTreeCloner.slnx

      - name: Build
        run: dotnet build AdoWorkItemTreeCloner.slnx --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test AdoWorkItemTreeCloner.slnx --no-build --configuration Release
          --report-trx --results-directory ${{ github.workspace }}/TestResults
          --coverage --coverage-output-format cobertura

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Results
          path: "TestResults/*.trx"
          reporter: dotnet-trx
          fail-on-error: false

      - name: Publish coverage summary
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: "TestResults/**/*.cobertura.xml"
          badge: true
          format: markdown
          output: both

      - name: Add coverage summary to job summary
        if: always()
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare coverage badge
        if: always()
        run: |
          mkdir -p badge
          badge_url=$(grep -oE 'https://img\.shields\.io/badge/[^)]+' code-coverage-results.md | head -n 1)
          if [ -n "$badge_url" ]; then
            curl -sSL "$badge_url" -o badge/ci-coverage.svg
          else
            echo "::warning::No shields.io badge URL found in code-coverage-results.md; skipping badge update."
          fi

      - name: Publish coverage badge
        if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && hashFiles('badge/ci-coverage.svg') != ''
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: badges
          folder: badge
          clean: false

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            TestResults/**
            code-coverage-results.md
